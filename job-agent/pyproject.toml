[project]
name = "jobpilot"
version = "0.1.0"
description = "Autonomous, safety-first job application agent."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.2",
    "langgraph>=0.2.35",
    "openai>=1.52.0",
    "playwright>=1.48.0",
    "pydantic>=2.9.2",
    "pydantic-ai>=0.0.13",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.10.0",
    "rich>=13.9.2",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
